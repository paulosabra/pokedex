name: Update Goldens

# Manual trigger only. Run this once whenever golden baselines need to be
# (re)generated on the SAME platform the CI test job uses (Linux / ubuntu).
#
# Why this exists: goldens authored on a developer's machine (e.g. macOS)
# render with slightly different anti-aliasing than ubuntu-latest, so the
# zero/low-tolerance comparator in test/flutter_test_config.dart rejects them.
# This job rebaselines the PNGs on Linux and commits them back to the branch,
# after which the normal CI run diffs at ~0%.
#
# How to use: GitHub → Actions → "Update Goldens" → Run workflow → pick the
# branch. It pushes a "regenerate golden baselines" commit to that branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # MUST match the version pinned in ci.yaml so the regenerated
          # baselines line up with what the test job renders.
          channel: stable
          flutter-version: 3.44.0

      - name: Install dependencies
        run: flutter pub get

      # Generated code is git-ignored, so regenerate before rendering goldens.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate golden baselines
        run: flutter test --update-goldens

      - name: Commit and push updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find test -type f -path '*/goldens/*.png' -print0 \
            | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Goldens already up to date — nothing to commit."
          else
            git commit -m "test: regenerate golden baselines on Linux CI"
            git push
          fi
