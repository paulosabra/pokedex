name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite (sqflite_common_ffi)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install very_good CLI
        run: dart pub global activate very_good_cli

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: |
          if ! find test -name '*_test.dart' 2>/dev/null | grep -q .; then
            echo "No tests yet; skipping."
            exit 0
          fi
          very_good test --coverage --min-coverage 80 --exclude-coverage "lib/main.dart"
