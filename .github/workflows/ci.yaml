name: CI

on:
  pull_request:
    branches:
      - "epic/**"
      - develop
      - main
  push:
    branches:
      - "epic/**"
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned for deterministic builds AND golden stability: golden
          # baselines are rendered by a specific engine/Skia + bundled font,
          # so an unpinned `stable` can shift sub-pixel anti-aliasing and break
          # pixel tests on an SDK bump. Keep this in sync with the version used
          # to (re)generate goldens — see .github/workflows/update-goldens.yml.
          channel: stable
          flutter-version: 3.44.0

      - name: Install dependencies
        run: flutter pub get

      # Generated code is git-ignored, so a fresh clone must regenerate before
      # analyze/test. This also validates that the codegen builder graph instantiates.
      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --coverage
