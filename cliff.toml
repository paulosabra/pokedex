# git-cliff configuration — generates CHANGELOG.md from the Conventional-Commit
# history (D-4). Regenerate with: `git-cliff -o CHANGELOG.md`.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Rendered once at the top of the file.
header = """
# Changelog

All notable changes to this project are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Conventional Commits](https://www.conventionalcommits.org).
This file is generated from the commit history by [git-cliff](https://git-cliff.org) —
do not edit it by hand.\n
"""
# Tera template applied per release section.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
# Parse commits as Conventional Commits and drop anything that does not match
# (filter_unconventional also discards merge commits).
conventional_commits = true
filter_unconventional = true
# Map commit types/scopes to changelog sections. Order here sets section order;
# the `<!-- N -->` prefixes order the groups and are stripped by `striptags`.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactors" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^test", group = "<!-- 4 -->Tests" },
  { message = "^ci", group = "<!-- 5 -->CI/CD" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = "^build", group = "<!-- 7 -->Chores" },
]
# Newest release first, newest commit first within a release.
tag_pattern = "v[0-9].*"
sort_commits = "newest"
